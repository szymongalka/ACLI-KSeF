[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "asef"
version = "0.1.0"
description = "Agencyjny System Elektronicznych Faktur: lokalne CLI i skill dla KSeF"
authors = [{ name = "Szymon Gałka", email = "kontakt@szymongalka.dev" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "httpx>=0.27",
  "jinja2>=3.1",
  "keyring>=25",
  "lxml>=5",
  "platformdirs>=4",
  "reportlab>=4",
  "signxml>=4.2,<5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
asef = "asef.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/asef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
